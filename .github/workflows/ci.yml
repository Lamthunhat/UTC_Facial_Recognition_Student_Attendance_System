name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Chạy tay từ tab Actions / `gh workflow run CI` (chạy lại CI không cần commit giả)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Tests (mọi package; integration dùng PGlite, không cần DB ngoài)
        run: pnpm test
      - name: Audit dependencies (chặn High/Critical — FR-096)
        run: pnpm audit --prod --audit-level high

  # Repo private (tài khoản cá nhân) không có code scanning miễn phí → không upload lên tab Security.
  # CodeQL vẫn phân tích; kết quả SARIF được chặn ngay trong CI và lưu làm artifact để tải về xem.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: codeql-results
      - name: Lưu kết quả SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: ignore
      - name: Chặn khi có cảnh báo bảo mật (error/warning)
        run: node .github/scripts/codeql-gate.mjs codeql-results
